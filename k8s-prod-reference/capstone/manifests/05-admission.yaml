# Admission control — capstone enforcement layer.
#
# Defends against: any pod being created in a capstone tier namespace
# without the security context we require (lab 05).
#
# Architecture: a Python webhook Deployment running in capstone-system,
# with the webhook code injected via `command:` override (no need to
# build a separate image — reuses the lab 05 python:3.12-alpine image).
#
# What this policy denies:
#   - Containers without a securityContext
#   - Containers with runAsUser: 0 (root)
#   - Containers with allowPrivilegeEscalation: true
#   - hostPath volumes
#
# Applies only to the capstone tier namespaces (capstone-frontend,
# capstone-backend, capstone-postgres). System namespaces and
# capstone-system are exempt via the ValidatingWebhookConfiguration's
# namespaceSelector.
---
# ServiceAccount + RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capstone-webhook
  namespace: capstone-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capstone-webhook
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capstone-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: capstone-webhook
subjects:
- kind: ServiceAccount
  name: capstone-webhook
  namespace: capstone-system
---
# Deployment: inject the webhook code via command override
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-webhook
  namespace: capstone-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capstone-webhook
  template:
    metadata:
      labels:
        app: capstone-webhook
    spec:
      serviceAccountName: capstone-webhook
      containers:
      - name: webhook
        image: python:3.12-alpine
        # The webhook code, as a single command. Injects logic that
        # accepts pods in the capstone tier namespaces only if their
        # securityContext meets our baseline (non-root, no escalation,
        # explicit securityContext, no hostPath).
        command: ["python", "-c", "import json,ssl\nfrom http.server import BaseHTTPRequestHandler,HTTPServer\nclass TLSHTTPServer(HTTPServer):\n    def get_request(self):\n        sock,addr=self.socket.accept()\n        ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)\n        ctx.load_cert_chain('/tls/tls.crt','/tls/tls.key')\n        return ctx.wrap_socket(sock,server_side=True),addr\nALLOWED={'capstone-frontend','capstone-backend','capstone-postgres'}\nclass H(BaseHTTPRequestHandler):\n    def do_POST(self):\n        n=int(self.headers.get('content-length','0'))\n        review=json.loads(self.rfile.read(n))\n        req=review['request'];obj=req['object'];ns=obj['metadata']['namespace'];uid=req['uid']\n        if ns not in ALLOWED:\n            allowed=True;reason=''\n        else:\n            bad=[]\n            for c in obj['spec'].get('containers',[]):\n                if 'securityContext' not in c:\n                    bad.append(f\"container '{c['name']}' has no securityContext\");continue\n                sc=c['securityContext'] or {}\n                if sc.get('runAsUser')==0:bad.append(f\"container '{c['name']}' runs as root\")\n                if sc.get('allowPrivilegeEscalation') is True:bad.append(f\"container '{c['name']}' allows privilege escalation\")\n            for v in obj['spec'].get('volumes',[]) or []:\n                if 'hostPath' in v:bad.append(f\"hostPath mount: {v['hostPath']['path']}\")\n            allowed=(len(bad)==0);reason='; '.join(bad)\n        resp={'apiVersion':'admission.k8s.io/v1','kind':'AdmissionReview','response':{'uid':uid,'allowed':allowed}}\n        if not allowed:resp['response']['status']={'message':reason}\n        body=json.dumps(resp).encode()\n        self.send_response(200);self.send_header('Content-Type','application/json');self.send_header('Content-Length',str(len(body)));self.end_headers();self.wfile.write(body)\n    def log_message(self,*a,**kw):pass\nTLSHTTPServer(('0.0.0.0',8443),H).serve_forever()"]
        ports:
        - containerPort: 8443
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
      volumes:
      - name: tls
        secret:
          secretName: capstone-webhook-tls
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-webhook
  namespace: capstone-system
spec:
  selector:
    app: capstone-webhook
  ports:
  - port: 443
    targetPort: 8443