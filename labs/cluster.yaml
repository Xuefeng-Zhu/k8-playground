# kind cluster config — 1 control-plane + 2 workers
# Sized for a 2-CPU / 16GB host. Adjust kubelet memory if you see OOMs.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: prod-lab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 18080
        protocol: TCP
      - containerPort: 443
        hostPort: 18443
        protocol: TCP
  - role: worker
    labels:
      topology.kubernetes.io/zone: a
  - role: worker
    labels:
      topology.kubernetes.io/zone: b
networking:
  # Disable default CNI's IPv6 to avoid dual-stack surprises in lab work
  ipFamily: ipv4
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"